name: Build, Sign & Release Apps (Android & iOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated release build with testing APK and signed publishing bundles.'

permissions:
  contents: write
  packages: write

jobs:
  # ===========================================================================
  # 1. ANDROID BUILD JOB (Debug APK, Signed Release APK & Play Store AAB)
  # ===========================================================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Recreate Android Project Scaffold & Install Dependencies
        run: |
          rm -rf android
          flutter create . --org com.example --project-name clap_to_find --platforms android
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          printf "\ndependency_overrides:\n  record_linux: 0.7.1\n  record_platform_interface: 1.0.0\n" >> pubspec.yaml
          grep -q "widgets.dart" lib/services/audio_service.dart || sed -i '1s/^/import \x27package:flutter\/widgets.dart\x27;\n/' lib/services/audio_service.dart
          sed -i 's/AudioEncoder.pcm16bits/AudioEncoder.pcm16bit/g' lib/services/audio_service.dart

          # Ensure assets directory and alarm sound exist (no ffmpeg needed)
          mkdir -p assets/sounds
          if [ ! -s assets/sounds/alarm_siren.mp3 ]; then
            curl -s -L -o assets/sounds/alarm_siren.mp3 "https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" || true
            [ -s assets/sounds/alarm_siren.mp3 ] || touch assets/sounds/alarm_siren.mp3
          fi

          # Force compileSdk 34 for root and app across both Groovy (.gradle) and Kotlin DSL (.gradle.kts)
          node -e '
          const fs = require("fs");
          if (fs.existsSync("android/build.gradle")) {
            fs.appendFileSync("android/build.gradle", "\nsubprojects { afterEvaluate { project -> if (project.hasProperty(\x22android\x22)) { project.android { compileSdkVersion 34 } } } }\n");
          }
          if (fs.existsSync("android/build.gradle.kts")) {
            fs.appendFileSync("android/build.gradle.kts", "\nsubprojects {\n    afterEvaluate {\n        if (project.hasProperty(\x22android\x22)) {\n            val android = project.extensions.findByName(\x22android\x22) as? com.android.build.gradle.BaseExtension\n            android?.compileSdkVersion(34)\n        }\n    }\n}\n");
          }
          ["android/app/build.gradle", "android/app/build.gradle.kts"].forEach(f => {
            if (fs.existsSync(f)) {
              let c = fs.readFileSync(f, "utf8");
              c = c.replace(/flutter\.compileSdkVersion/g, "34")
                   .replace(/compileSdkVersion\s+[0-9]+/g, "compileSdkVersion 34")
                   .replace(/compileSdk\s*=\s*[0-9]+/g, "compileSdk = 34");
              fs.writeFileSync(f, c);
            }
          });
          '
          flutter pub get

      - name: Configure Android Signing Keystore
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using production keystore from repository secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore/release.jks
            echo "KEYSTORE_FILE=keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating automated release signing keystore..."
            keytool -genkeypair -v -keystore android/app/keystore/release.jks \
              -alias claptofindkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass claptofindpassword -keypass claptofindpassword \
              -dname "CN=ClapToFind, OU=Mobile, O=App, L=City, S=State, C=US"
            echo "KEYSTORE_FILE=keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=claptofindpassword" >> $GITHUB_ENV
            echo "KEY_ALIAS=claptofindkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=claptofindpassword" >> $GITHUB_ENV
          fi

      # Build 1: Debug APK (Ideal for instant testing and sideloading on any phone)
      - name: Build Android Debug APK (Testing)
        run: flutter build apk --debug

      # Build 2: Signed Release APK (Direct user distribution & testing)
      - name: Build Android Signed Release APK
        run: flutter build apk --release

      # Build 3: Signed Android App Bundle (AAB for Google Play Console publishing)
      - name: Build Android App Bundle (Play Store AAB)
        run: flutter build appbundle --release

      - name: Organize Android Artifacts
        run: |
          mkdir -p output/android
          cp build/app/outputs/flutter-apk/app-debug.apk output/android/clap-to-find-testing-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk output/android/clap-to-find-release-signed.apk
          cp build/app/outputs/bundle/release/app-release.aab output/android/clap-to-find-playstore-signed.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: output/android/*
          retention-days: 30
